[package]
name = "ods2cascade"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow    = "1.0.100"
atoi      = "2.0.0"
cascade   = { git = "http://github.com/NLnetLabs/cascade", rev = "v0.1.0-alpha", version = "0.1.0-alpha" }
domain    = { git = "https://github.com/NLnetLabs/domain", branch = "patches-for-nameshed-prototype" }
quick-xml = { version = "0.38.3", features = ["serialize"] }
sanitize-filename = "0.6.0"
serde     = { version = "1.0.228", features = ["derive"] }
sqlx      = { version = "0.8.6", features = ["sqlite", "mysql"] }
tokio     = { version = "1.48.0", features = ["rt", "macros"] }
